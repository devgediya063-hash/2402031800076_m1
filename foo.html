<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function(Return Value)</title>
</head>
<body>
    <h1>Function(Return Value)</h1>
    <script>
        function foo (p1)
        {
            if (typeof(p1) === "number")
                return 0;
            else
            if (typeof(p1) === "string")
                return "Hello World";
        }
        foo(1);
        foo("abc");
        foo();
        document.write(foo(1));
        document.write("<br>");
        document.write(foo("abc"));
        document.write("<br>");
        document.write(foo());
    </script>
</body>
</html>
