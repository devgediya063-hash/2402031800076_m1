<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Example</title>
</head>
<body>
    <script>
        var person = new Object();

        person.firstName = "Dev";
        person.lastName = "Gediya";

        person.sayHi = ()=>{
            alert("Welcome " + person.firstName + " " + person.lastName);
        }
        person.sayHi();
    </script>
</body>
</html>
