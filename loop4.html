<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate multiplication table</title>
</head>
<body>
    <h1>Generate multiplication table</h1>
    <script>
        var num = prompt("Please enter a number to generate its multiplication table:");
        document.write("Multiplication Table of " + num + ":");
        document.write("<br>");
        for(var i = 1; i <= 10; i++){
            document.write(num + " x " + i + " = " + (num * i));
            document.write("<br>");
        }
    </script>
</body>
</html>
