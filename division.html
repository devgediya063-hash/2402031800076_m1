<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Program</title>
</head>
<body>
    <h1>Check Division by 5:</h1>
    <script>
        var num1 = prompt("Please enter the first number:");
        var num2 = 5;

        if (num2 !== 0) {
            document.write("The result of the division is: " + (num1 / num2));
        } else {
            document.write("Error: Division by zero is not allowed.");
        }
    </script>
</body>
</html>
