<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest of Three Numbers</title>
</head>
<body>
    <h1>Largest of Three Numbers</h1>
    <script>
        var num1 = prompt("Please enter the first number:");
        var num2 = prompt("Please enter the second number:");
        var num3 = prompt("Please enter the third number:");

        var largest = num1;

        if (num2 > largest) {
            largest = num2;
        }

        if (num3 > largest) {
            largest = num3;
        }

        document.write("The largest number is: " + largest);
    </script>
</body>
</html>
