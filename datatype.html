<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Types</title>
</head>
<body>
    <script>
       var x=10;
       var y=20.5;
       var y=true;
       var z="Hello";
       var a=null;
       var b=undefined;
       var arr=[1,2,3]; 
       document.write(typeof x);
       document.write("<br>" + x);
       document.write("<br>" + typeof y);
       document.write("<br>" + y);
       document.write("<br>" + typeof z);
       document.write("<br>" + z);
       document.write("<br>" + typeof a);
       document.write("<br>" + a);
       document.write("<br>" + typeof b);
       document.write("<br>" + b);
       document.write("<br>" + typeof arr);
       document.write("<br>" + arr);
    </script>
</body>
</html>
