<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Student Name</title>
</head>
<body>
    <h1>Display Student Name</h1>
    <script>
        var i;
        var arr =[i];
        for(i = 0; i < 3; i++){
            arr[i] = prompt("Please enter student name:");
            document.write("Student " + (i+1) + ": " + arr[i]);
            document.write("<br>");
        }
    </script>
</body>
</html>
