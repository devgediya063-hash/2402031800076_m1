<html>
<head>
    <title>Variable Example</title>
</head>
<body>
    <h1>JavaScript Variables</h1>
    <p>In this example x, y, and z are variables:</p>
    <p id="para"></p>
    <p id="para1"></p>
    <p id="para2"></p>
    <p id="para3"></p>
    <p id="para4"></p>
    <p id="para5"></p>
    <p id="para6"></p>
    <p id="para7"></p>
    <p id="para8"></p>
    <script>
        var x = 5;
        var y = 6;
        var z = x * y;
        var p = x++;
        var q = ++y;
        var a = 10;
        var b = a >= x;
        var c = a <= y;
        var d = x--;
        document.getElementById("para").innerHTML = "The value of x is: " + x;
        document.getElementById("para1").innerHTML = "The value of y is: " + y;
        document.getElementById("para2").innerHTML = "The value of z is: " + z;
        document.getElementById("para3").innerHTML = "The value of p is: " + p;
        document.getElementById("para4").innerHTML = "The value of q is: " + q;
        document.getElementById("para5").innerHTML = "The value of a is: " + a;
        document.getElementById("para6").innerHTML = "The value of b is: " + b;
        document.getElementById("para7").innerHTML = "The value of c is: " + c;
        document.getElementById("para8").innerHTML = "The value of d is: " + d;
    </script>
</body>
</html>
