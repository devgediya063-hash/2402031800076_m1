<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Functions</title>
</head>
<body>
    <script>
        document.write(Math.PI);
        document.write("<br>");

        document.write(Math.E);
        document.write("<br>");

       var num = Math.random();
       document.write(num);
       document.write("<br>");

       document.write(Math.pow(2, 4));
       document.write("<br>");

       var num2 = parseInt(1 + (Math.random() * 100));
       document.write(num2);
       document.write("<br>");

       document.write(Math.ceil(2.7));
       document.write("<br>");

       document.write(Math.floor(2.7));
       document.write("<br>");
       
       document.write(Math.round(2.7));
       document.write("<br>");
    </script>
</body>
</html>
