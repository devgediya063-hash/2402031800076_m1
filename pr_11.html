<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouseover and Mouseout</title>
</head>
<body>
    <img src="file:///C:/Users/devge/Downloads/realistic-light-bulb-with-electricity_23-2149129410.avif" alt="" id="bulb">
</body>
<script>
    var a = document.getElementById("bulb");
    a.addEventListener("mouseover",()=>{
        a.src="img/bulb2.jpg";
    });
    a.addEventListener("mouseout",()=>{
        a.src = "img/bulb1.jpg";
    });
</script>
</html>
