<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print number 1 to 10</title>
</head>
<body>
    <h1>Print number 1 to 10.</h1>
    <script>
        for(var a = 0; a <= 10; a++){
            document.write("Value of a is: " + a);
            document.write("<br>");
        }
    </script>
</body>
</html>
